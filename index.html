<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine?</title>
  <style>
    :root{
      --bg1:#fff1f7;
      --bg2:#f1f5ff;
      --card:#ffffffcc;
      --text:#111827;
      --muted:#6b7280;
      --yes:#16a34a;
      --no:#ef4444;
      --shadow: 0 18px 40px rgba(17,24,39,.12);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 700px at 20% 10%, var(--bg1), transparent 60%),
                  radial-gradient(1100px 700px at 80% 90%, var(--bg2), transparent 60%),
                  #ffffff;
      padding: 24px;
    }

    .card{
      width:min(560px, 100%);
      background: var(--card);
      border: 1px solid rgba(0,0,0,.06);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
      text-align:center;
    }

    h1{
      margin: 0 0 10px;
      font-size: clamp(26px, 4vw, 40px);
      letter-spacing: -0.02em;
    }

    p{
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.4;
      min-height: 22px;
    }

    .buttons{
      display:flex;
      gap: 12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 10px;
    }

    button{
      border:0;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
      transition: transform .08s ease, filter .2s ease, opacity .2s ease;
      box-shadow: 0 10px 18px rgba(0,0,0,.10);
    }
    button:active{ transform: translateY(1px) scale(.99); }

    .yes{
      background: linear-gradient(135deg, #22c55e, var(--yes));
      color:white;
    }
    .no{
      background: linear-gradient(135deg, #fb7185, var(--no));
      color:white;
    }

    .gif-wrap{
      margin-top: 18px;
      display:none;
      animation: pop .25s ease-out;
    }
    .gif-wrap img{
      width: min(420px, 100%);
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
    }

    .tiny{
      margin-top: 14px;
      font-size: 12px;
      color: rgba(107,114,128,.9);
    }

    @keyframes pop{
      from{ transform: scale(.96); opacity: 0; }
      to{ transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Will you be my Valentine?</h1>
    <p id="sub">Choose wisely!!!!!!!!!!!!! MWAH</p>

    <div class="buttons" id="btnRow">
      <button class="yes" id="yesBtn">Yes</button>
      <button class="no" id="noBtn">No</button>
    </div>

    <div class="gif-wrap" id="gifWrap" aria-live="polite">
      <img 
        src="https://media.tenor.com/DpJdyKQKgYkAAAAj/cat-jump.gif"
        alt="Happy jumping cat"
        />

      <div class="tiny">YAYYYYY 🥳</div>
    </div>
  </div>

  <script>
    const titleEl = document.getElementById("title");
    const subEl = document.getElementById("sub");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const gifWrap = document.getElementById("gifWrap");
    const btnRow = document.getElementById("btnRow");

    // Infinite escalation phrases for the "No" path
    const prompts = [
      "Are you sure? ",
      "Are you sureeeeee? 🥺",
      "Are you weally weally sure???? ",
      "Like… 100% sure?? ",
      "Absolutely undeniably sure??? ",
      "Final answer??",
      "You really wanna do this to me?? 💔",
      "Okay but baby are you SURE sure sure?? "
    ];

    let noCount = 0;

    function handleYes(){
      titleEl.textContent = "YAYAYYAYYAYAYAYA. On this day or any other, you're mine forever my sweet baby girl Mwah. I love you so much bubu";
      subEl.textContent = "THANK YOU BABYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY AYYAYAYAYYAYAAY";
      gifWrap.style.display = "block";
      btnRow.style.display = "none";
    }

    function handleNo(){
      // Escalate forever: cycle + add more letters/punctuation as it grows
      const base = prompts[noCount % prompts.length];
      const extra = "!".repeat(Math.min(10, Math.floor(noCount / 2)));
      const moreE = "e".repeat(Math.min(25, noCount)); // sureeeeeeeeee...
      const mutated = base
        .replace("sureeeee", "sure" + moreE)
        .replace("????", "?".repeat(Math.min(12, 4 + noCount)));

      titleEl.textContent = mutated + extra;
      subEl.textContent = "Click yes. PLEASEEEEE";

      // Make "Yes" slowly feel more irresistible
      const scale = Math.min(1.0 + noCount * 0.06, 2.2);
      yesBtn.style.transform = `scale(${scale})`;
      yesBtn.style.filter = `saturate(${Math.min(1 + noCount * 0.15, 2.5)})`;

      // Make "No" slightly smaller (but still clickable)
      const noScale = Math.max(1.0 - noCount * 0.03, 0.6);
      noBtn.style.transform = `scale(${noScale})`;
      noBtn.style.opacity = `${Math.max(1.0 - noCount * 0.05, 0.35)}`;

      noCount += 1;
    }

    yesBtn.addEventListener("click", handleYes);
    noBtn.addEventListener("click", handleNo);

    // Optional: Enter key triggers Yes (cute)
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleYes();
    });
  </script>
</body>
</html>
